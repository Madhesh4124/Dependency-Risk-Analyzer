# GCP Workflows: Tier B Benchmark Orchestrator
# Triggered by: Cloud Scheduler or manual invocation
# Flow:
#   Cloud Scheduler -> GCP Workflows -> GitHub API -> Filter Candidates
#   -> Trigger Cloud Run Job -> Parse Metadata + Diff -> Validate -> Cloud Storage (JSONL) + Firestore

main:
  params: [args]
  steps:
    - init:
        assign:
          - projectId: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: "asia-south1"
          - jobName: "tier-b-collector-job"
          - queryPackages: ["fastapi", "sqlalchemy", "httpx", "cryptography", "numpy", "pandas", "click", "redis"]
          - candidateUrls: []
          - githubAuthHeader: ""

    - checkOverrides:
        switch:
          - condition: ${args != null and "region" in args}
            assign:
              - region: ${args.region}
          - condition: ${args != null and "jobName" in args}
            assign:
              - jobName: ${args.jobName}
          - condition: ${args != null and "queryPackages" in args}
            assign:
              - queryPackages: ${args.queryPackages}

    - tryLoadSecret:
        try:
          steps:
            - accessSecret:
                call: googleapis.secretmanager.v1.projects.secrets.versions.access
                args:
                  name: ${"projects/" + projectId + "/secrets/github-token/versions/latest"}
                result: secretResp
            - setAuthHeader:
                assign:
                  - githubAuthHeader: ${"Bearer " + text.decode(base64.decode(secretResp.payload.data))}
        except:
          as: err
          steps:
            - ignoreSecretError:
                assign:
                  - githubAuthHeader: ""

    - iteratePackages:
        for:
          value: pkg
          in: ${queryPackages}
          steps:
            - searchGitHub:
                call: http.get
                args:
                  url: "https://api.github.com/search/issues"
                  headers:
                    User-Agent: "GCP-Workflows-Collector/2.0"
                    Accept: "application/vnd.github.v3+json"
                    Authorization: ${githubAuthHeader}
                  query:
                    q: ${"is:pr is:closed \"Bump " + pkg + " from\" in:title"}
                    sort: "updated"
                    order: "desc"
                    per_page: 10
                result: searchResponse

            - filterCandidates:
                for:
                  value: item
                  in: ${searchResponse.body.items}
                  steps:
                    - appendUrl:
                        assign:
                          - candidateUrls: ${list.concat(candidateUrls, [item.html_url])}

            - pauseToRespectRateLimits:
                call: sys.sleep
                args:
                  seconds: 2

    - checkCandidatesFound:
        switch:
          - condition: ${len(candidateUrls) == 0}
            return:
              status: "NO_CANDIDATES_FOUND"

    - triggerCloudRunJob:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + projectId + "/locations/" + region + "/jobs/" + jobName}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: "CANDIDATE_PR_URLS"
                      value: ${json.encode_to_string(candidateUrls)}
        result: jobExecution

    - waitJobCompletion:
        call: googleapis.run.v2.projects.locations.jobs.executions.get
        args:
          name: ${jobExecution.name}
        result: executionStatus

    - finish:
        return:
          status: "SUCCESS"
          candidates_dispatched: ${len(candidateUrls)}
          job_execution: ${jobExecution.name}
